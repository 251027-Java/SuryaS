
<p>Hello from Parent Component!</p>

<p>LOOK AT MY CHILDREN:</p>

<!-- *ngFor - great for dynamically rendering multiple elements . for every element in the array render/generate something. -->

<div>
    <!-- for every element in the array called arr, render this text. array is in .ts -->

    <app-child-component *ngFor ="let num of arr"[index]="num"></app-child-component>

    
<!--<p *ngFor = "let num of arr; let i = index">Hello I'm child {{i}}</p>-->
</div>


<!-- binding: typescript -> HTML -->

<!-- {{STRING INTERPOLATION}} - taking a value from typescript and rendering it on HTML page-->
<h3>I have {{arr.length}} children!</h3>

<!-- *ngIf - great for conditionally rendering an element -->
<p *ngIf = "arr.length > 4">Oh god, I'm so exhausted I have so many children!</p>

<!-- {EVENT BINDING} - attaching a function in the typescript to some event in the HTML -->
<button (click)="showSurprise()">Click me for a surprise!</button>

<!-- [PROPERTY BINDING] - using the value of a variable in the typescript to determine the value of an element's attributes.-->
<h1 [hidden]="hideElement">Now I'm visible!</h1>

<!-- [(TWO WAY BINDING)] - Lets us take user input and save it in a variable saved in the typescript. -->
<h3>Wait a minute... who ARE you?</h3>

<!-- nameInput is from parent typescript -->
<input type ="text" [(ngModel)]="nameInput">
<!-- falsy: won't display name, truthy: will display name-->
<p *ngIf="nameInput">Nice to meet you, {{nameInput}}</p>
